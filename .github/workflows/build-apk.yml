name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Config de Bubblewrap sense prompts (JDK/SDK)
        run: |
          set -e
          JDK="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JDK",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          echo "config.json amb JDK=$JDK"

      - name: Init + Build APK (PTY amb respostes temporitzades)
        shell: bash
        run: |
          set -e
          rm -f twa-manifest.json android.keystore
          # --- INIT: crea plantilla gradle, twa-manifest i keystore ---
          # respostes: crear keystore 'y' + password x3 (per si pregunta alias)
          ( sleep 10; printf 'y\n'; sleep 3; printf 'midweek123\n'; sleep 3; printf 'midweek123\n'; sleep 3; printf 'midweek123\n'; sleep 300 ) \
            | script -qec "bubblewrap init --manifest https://roserpasc.github.io/midweek/manifest.json --directory=. --skipPwaValidation" /dev/null || true
          ls -la
          [ -f twa-manifest.json ] || { echo "FAIL: no s'ha generat twa-manifest.json"; exit 1; }
          [ -f android.keystore ] || keytool -genkeypair -v -keystore android.keystore -alias my-key-alias \
              -keyalg RSA -keysize 2048 -validity 10950 -storepass midweek123 -keypass midweek123 \
              -dname "CN=Midweek, O=Midweek, L=Barcelona, C=ES" || true
          # --- BUILD: gradle assembleRelease ---
          # respostes: 'n' (no regenerar) + password keystore + password key
          ( sleep 12; printf 'n\n'; sleep 4; printf 'midweek123\n'; sleep 4; printf 'midweek123\n'; sleep 600 ) \
            | script -qec "bubblewrap build --skipPwaValidation --directory=." /dev/null

      - name: Collect APK
        if: always()
        run: |
          mkdir -p out
          find . -maxdepth 2 -name "*.apk" -exec cp {} out/ \; || true
          ls -la out/ || true
          [ -f out/app-release-signed.apk ] || [ -f out/app-release-bundle-signed.apk ] || { echo "No hi ha APK"; ls -la; }

      - uses: actions/upload-artifact@v4
        with:
          name: midweek-apk
          path: out/
          if-no-files-found: error
