name: Build Android APK (TWA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'manifest.json'
      - 'twa-manifest.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Preparar configuracio de Bubblewrap (sense prompts)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME || '/usr/lib/jvm/temurin-17-jdk-amd64' }}
        run: |
          set -e
          JDK="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
          echo "JDK detectat: $JDK"
          mkdir -p ~/.bubblewrap
          # aixo evita TOTS els prompts d'instal·lacio de JDK/SDK
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "$JDK",
            "androidSdkPath": "$ANDROID_HOME"
          }
          EOF
          cat ~/.bubblewrap/config.json

      - name: Generar twa-manifest.json i keystore si no existeixen
        run: |
          set -e
          if [ ! -f twa-manifest.json ]; then
            cat > twa-manifest.json <<'EOF'
          {
            "packageId": "ca.midweek.app",
            "host": "roserpasc.github.io",
            "name": "Midweek",
            "launcherName": "Midweek",
            "display": "standalone",
            "themeColor": "#5E8772",
            "themeColorDark": "#26312B",
            "navigationColor": "#5E8772",
            "navigationColorDark": "#26312B",
            "navigationDividerColor": "#5E8772",
            "navigationDividerColorDark": "#26312B",
            "backgroundColor": "#F2F5F1",
            "enableNotifications": false,
            "startUrl": "/midweek/",
            "iconUrl": "https://roserpasc.github.io/midweek/icons/icon-maskable.png",
            "maskableIconUrl": "https://roserpasc.github.io/midweek/icons/icon-maskable.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "shortcuts": [],
            "generatorApp": "Bubblewrap",
            "webManifestUrl": "https://roserpasc.github.io/midweek/manifest.json",
            "fallbackType": "customtabs",
            "features": {},
            "alphaDependencies": { "enabled": false },
            "enableSiteSettingsShortcut": true,
            "isChromeOSOnly": false,
            "isMetaQuest": false,
            "fullScopeUrl": "https://roserpasc.github.io/midweek/",
            "minSdkVersion": 19,
            "orientation": "portrait",
            "fingerprints": [],
            "additionalTrustedOrigins": [],
            "retainedBundles": []
          }
          EOF
          fi
          if [ ! -f android.keystore ]; then
            # keystore determinista per a demo (NO per a Play Store en produccio)
            keytool -genkeypair -v -keystore android.keystore -alias android \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass midweek123 -keypass midweek123 \
              -dname "CN=Midweek, OU=Midweek, O=Midweek, L=Barcelona, S=Catalunya, C=ES"
          fi

      - name: Build APK
        shell: bash
        run: |
          # inquirer (bubblewrap) exigeix TTY: usem `script` com a pseudo-terminal.
          # respostes: 'n' (no regenerar) + password del keystore (x2 si pregunta alias)
          printf 'n\nmidweek123\nmidweek123\nmidweek123\n' | script -qec "bubblewrap build --skipPwaValidation --directory=." /dev/null
          ls -la *.apk || true

      - name: Collect APK
        run: |
          mkdir -p out
          find . -maxdepth 2 -name "*.apk" -exec cp {} out/ \;
          ls -la out/

      - uses: actions/upload-artifact@v4
        with:
          name: midweek-apk
          path: out/
